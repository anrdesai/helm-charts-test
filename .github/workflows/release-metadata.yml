name: Publish release-metadata

# Mirrors the real repo's release flow: a single manual run publishes the chart
# (own upload logic: GitHub Release + asset) AND updates index.yaml on gh-pages
# via `cr index` (index-only; cr does not create the release).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 1.1.0)
        required: true

permissions:
  contents: write # create releases, upload assets, push gh-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cr reads/writes the index via a worktree of origin/gh-pages.
      - name: Fetch gh-pages ref
        run: git fetch origin gh-pages:refs/remotes/origin/gh-pages

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install chart-releaser (cr)
        run: |
          mkdir -p bin
          curl -sfL https://github.com/helm/chart-releaser/releases/download/v1.8.1/chart-releaser_1.8.1_linux_amd64.tar.gz \
            | tar -xz -C bin cr
          ./bin/cr version

      # Sandbox stand-in for the real build script (which resolves image digests
      # from ACR). Fills the values contract for this version and packages it.
      - name: Package chart
        run: |
          V="${{ inputs.version }}"
          rm -rf /tmp/chart && cp -r build/release-metadata-chart /tmp/chart
          cat > /tmp/chart/values.yaml <<EOF
          apiVersion: metadata.cleanroom.azure.com/v1
          kind: ReleaseMetadata
          metadata:
            release: $V
            published: "$(date +%Y-%m-%d)"
          images:
            ccf-run-js-app-virtual: mcr.microsoft.com/azurecleanroom/ccf/app/run-js/virtual@sha256:$(echo -n "virtual$V" | sha256sum | cut -c1-64)
            skr: mcr.microsoft.com/azurecleanroom/skr@sha256:$(echo -n "skr$V" | sha256sum | cut -c1-64)
          EOF
          mkdir -p .cr-release-packages
          helm package /tmp/chart --version "$V" --destination .cr-release-packages

      - name: Create Release and upload chart asset (own upload logic)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          gh release create "$V" --title "$V" --notes "release-metadata $V" || echo "release exists"
          gh release upload "$V" ".cr-release-packages/release-metadata-$V.tgz" --clobber

      - name: Update index.yaml on gh-pages (cr index only)
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          mkdir -p .cr-index
          ./bin/cr index \
            --owner "${{ github.repository_owner }}" \
            --git-repo "${{ github.event.repository.name }}" \
            --token "${{ github.token }}" \
            --package-path .cr-release-packages \
            --release-name-template "{{ .Version }}" \
            --pages-branch gh-pages --pages-index-path index.yaml \
            --index-path .cr-index/index.yaml \
            --push
