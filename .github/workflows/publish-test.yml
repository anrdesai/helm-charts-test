name: Publish release-metadata (test)

# Orchestration-only test of the real publish flow against PUBLIC MCR (no Azure):
# build the chart with real digests, upload it as a Release asset (skip-if-exists),
# open a single index.yaml PR via chart-releaser, and attest the .tgz.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must exist on MCR, e.g. 8.0.0)
        required: true
        default: "8.0.0"
      release-type:
        description: Comma-separated release-type tokens (empty = full release)
        required: false
        default: ""

permissions:
  contents: write # create releases, upload assets, push the PR branch
  pull-requests: write # cr index --pr opens the index PR
  id-token: write # attest-build-provenance (Sigstore OIDC)
  attestations: write # store the .tgz provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - uses: oras-project/setup-oras@v1

      # Own logic: create the Release for this tag (cr looks it up by {{ .Version }}).
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.version }}" --title "${{ inputs.version }}" --notes "test ${{ inputs.version }}" || echo "release exists"

      - name: Publish catalog (build + upload + cr index --pr)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./.github/scripts/release-metadata.ps1
          -tag ${{ inputs.version }}
          -releaseType "${{ inputs.release-type }}"
          -pagesBranch ${{ github.event.repository.default_branch }}

      - name: Attest the chart .tgz
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ runner.temp }}/cr-release-packages/release-metadata-${{ inputs.version }}.tgz
